<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display properties in css</title>
    <style>
        p{
            display: inline;
            background-color: aqua;
        }
        span{
            display: inline-block;
            background-color: aquamarine;
        }
        div{
            background-color: green;
            height: 60px;
            width: 60px;
            border: 2px solid red;
            display: none;
        }


    </style>
</head>
<body>
    <p>This paragraph by default behaves as a block</p>
    <span>Span by default behaves as a inline block</span>

    <div>
        This is block level container.
    </div>
</body>
</html>
