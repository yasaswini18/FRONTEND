<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display properties flex and grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        #parentcontainer{
            width: 100%;
            height: 725px;
            background-color: yellow;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-direction: row;
        }
        #parentcontainer > #childcontainer{
            width: 60px;
            height: 60px;
            background-color: blue;
        }
        .childcont{
             width: 60px;
            height: 60px;
            background-color: blue;
        }

    </style>
</head>
<body>
    <div id="parentcontainer">
        <div id="childcontainer">

        </div>
        <div class="childcont">

        </div>
        <div class="childcont">

        </div>
        <div class="childcont">

        </div>
    </div>
</body>
</html>
