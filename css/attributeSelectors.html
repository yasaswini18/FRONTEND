<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute Selector</title>
    <style>
        input[type="email"]{
            background-color: red;
            color: white;
        }

    </style>
</head>
<body>
   <label for="name">Enter your name</label> 
   <input type="text" id="name">
   <input type="email">
</body>
</html>
